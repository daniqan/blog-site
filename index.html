<!DOCTYPE html>

    <style>
        /* Apply Inter font */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Add a subtle background */
        body {
            background-color: #f9fafb; /* Tailwind gray-50 */
        }
        /* Ensure images don't exceed container width */
        img, svg {
            max-width: 100%;
            height: auto;
        }
        /* Style for the post container before content loads */
        #post-list-container:empty::before {
            content: "Loading posts...";
            display: block;
            text-align: center;
            padding: 2rem;
            color: #6b7280; /* Tailwind gray-500 */
        }

        /* Basic prose styling for post content */
        .prose p { margin-bottom: 1em; }
        .prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 { margin-bottom: 0.8em; line-height: 1.3; }
        .prose h1 { margin-top: 0; font-size: 2.25em; font-weight: 700;}
        .prose h2 { margin-top: 1.5em; font-size: 1.75em; font-weight: 600; }
        .prose h3 { margin-top: 1.2em; font-size: 1.375em; font-weight: 600; }
        .prose a { color: #4f46e5; /* Tailwind indigo-600 */ text-decoration: underline; }
        .prose a:hover { color: #3730a3; /* Tailwind indigo-800 */ }
        .prose ul, .prose ol { margin-left: 1.5em; margin-bottom: 1em; }
        .prose ul { list-style: disc; }
        .prose ol { list-style: decimal; }
        .prose li > p { margin-bottom: 0.5em; }
        .prose code { background-color: #e5e7eb; padding: 0.2em 0.4em; border-radius: 0.25rem; font-size: 0.9em; }
        .prose pre { background-color: #1f2937; color: #f3f4f6; padding: 1em; border-radius: 0.375rem; overflow-x: auto; margin-bottom: 1em;}
        .prose pre code { background-color: transparent; padding: 0; color: inherit; font-size: inherit; }
        .prose blockquote { border-left: 4px solid #d1d5db; padding-left: 1em; margin-left: 0; margin-right: 0; font-style: italic; color: #4b5563; }
        .prose img { margin-top: 1.5em; margin-bottom: 1.5em; border-radius: 0.375rem; }
        .prose hr { border-top: 1px solid #e5e7eb; margin-top: 2em; margin-bottom: 2em; }

        /* Animation and Layout Styles */
        .post-image-wrapper {
            transition: margin-bottom 0.5s ease-in-out, width 0.5s ease-in-out;
        }
        .post-image {
            transition: width 0.5s ease-in-out, height 0.5s ease-in-out;
        }
        .post-card-inner-flex {
            transition: flex-direction 0.1s 0s ease-in-out; /* Quick transition for layout change */
        }

        /* When article has .expanded-view class */
        .expanded-view .post-card-inner-flex {
            flex-direction: column;
            align-items: stretch; /* Make children take full width */
        }

        .expanded-view .post-image-wrapper {
            width: 100%; /* Take full width to allow image centering */
            margin-bottom: 1.5rem; /* Space below expanded image */
            flex-shrink: 0; /* Ensure it doesn't shrink if flex properties were different */
        }

        .expanded-view .post-image {
            width: 60%; /* Enlarge the image */
            max-width: 350px; /* Max size for the enlarged image */
            height: auto; /* Maintain aspect ratio */
            margin-left: auto;
            margin-right: auto;
            display: block; /* Crucial for margin auto centering */
        }
        .expanded-view .post-card-inner-flex > .flex-grow {
             /* The text container will naturally take full width */
        }
    </style>
</head>
<body class="antialiased">

    <script>
        // --- Simulated Markdown Blog Post Data ---
        const blogPostMarkdownStrings = [
`---
title: "Getting Started with Tailwind CSS"
author: "Jane Doe"
date: "April 10, 2025"
slug: "tailwind-css-intro"
imageUrl: "https://placehold.co/150x100/a78bfa/ffffff?text=Tailwind"
imageAlt: "Tailwind CSS logo placeholder"
snippet: "Tailwind CSS is a utility-first CSS framework packed with classes that can be composed to build any design, directly in your markup."
tags: ["css", "tailwind", "frontend"]
---
Tailwind CSS is a utility-first CSS framework packed with classes like \`flex\`, \`pt-4\`, \`text-center\` and \`rotate-90\` that can be composed to build any design, directly in your markup. It represents a different approach compared to component-based frameworks like Bootstrap or Foundation.

Instead of pre-designed components, Tailwind provides low-level utility classes that let you build completely custom designs without ever leaving your HTML. This can lead to faster development cycles once you get the hang of it.

## Why Use Utility-First?
Working with utility classes offers several advantages:
* You aren't wasting energy inventing class names.
* Your CSS stops growing. Using utilities means most styles are reused.
* Making changes feels safer. CSS is global, utilities are local.

### Getting Set Up
The easiest way to get started is using the Tailwind CLI. You can install it via npm:
\`\`\`bash
npm install -D tailwindcss
npx tailwindcss init
\`\`\`
This will create a \`tailwind.config.js\` file in your project. You'll need to configure your template paths and then run the CLI tool to scan your files and build your CSS.
`,
`---
title: "Understanding JavaScript Promises"
author: "John Smith"
date: "April 5, 2025"
slug: "js-promises-explained"
imageUrl: "https://placehold.co/150x100/facc15/ffffff?text=JS"
imageAlt: "JavaScript logo placeholder"
snippet: "Promises provide a cleaner way to handle asynchronous operations in JavaScript compared to traditional callbacks. Learn the basics here."
tags: ["javascript", "async", "es6"]
---
Promises are a fundamental part of modern JavaScript, providing a cleaner and more manageable way to handle asynchronous operations compared to traditional callback functions (often leading to "callback hell").

A Promise is an object representing the eventual completion (or failure) of an asynchronous operation and its resulting value.

### States of a Promise
A Promise can be in one of three states:
* **Pending:** Initial state, neither fulfilled nor rejected.
* **Fulfilled (Resolved):** Meaning that the operation completed successfully.
* **Rejected:** Meaning that the operation failed.

You typically work with promises using \`.then()\` for successful outcomes and \`.catch()\` for errors.
\`\`\`javascript
fetch('/api/data')
  .then(response => response.json())
  .then(data => console.log(data))
  .catch(error => console.error('Error fetching data:', error));
\`\`\`
Async/await syntax provides an even cleaner way to work with promises.
`,
`---
title: "A Guide to Responsive Web Design"
author: "Alex Johnson"
date: "March 28, 2025"
slug: "responsive-web-design-guide"
imageUrl: "https://placehold.co/150x100/34d399/ffffff?text=Responsive"
imageAlt: "Responsive design placeholder"
snippet: "With the variety of devices used to access the web today, responsive design is crucial. This guide covers the fundamental principles."
tags: ["css", "rwd", "web design"]
---
Responsive Web Design (RWD) is an approach that makes your web pages render well on a variety of devices and window or screen sizes. Content, design, and performance are necessary across all devices to ensure usability and satisfaction.

Key principles include:
* **Fluid Grids:** Using relative units like percentages, rather than fixed units like pixels, for layout.
* **Flexible Images:** Ensuring images can scale within their containing elements.
* **Media Queries:** Applying different CSS rules based on the characteristics of the device (like width, height, orientation).

Tailwind CSS provides excellent utilities for building responsive designs directly in your HTML.
`,
`---
title: "New Post: Introduction to SVGs"
author: "Chris Lee"
date: "April 11, 2025"
slug: "intro-to-svg"
imageUrl: "https://placehold.co/150x100/f87171/ffffff?text=SVG"
imageAlt: "SVG placeholder"
snippet: "Scalable Vector Graphics (SVG) are an XML-based vector image format for two-dimensional graphics. Discover their advantages."
tags: ["svg", "graphics", "web design"]
---
Scalable Vector Graphics (SVG) are an XML-based vector image format for two-dimensional graphics with support for interactivity and animation. Unlike raster images (like JPEGs or PNGs), SVGs are resolution-independent, meaning they look crisp at any size.

### Advantages of SVG:
* **Scalability:** No quality loss when zoomed or resized.
* **Small File Sizes:** Especially for simpler graphics.
* **Editable:** Can be modified with CSS and JavaScript.
* **Accessible:** Text within SVGs is selectable and searchable.
`
        ];

        // Store full markdown content by slug for easy retrieval
        const fullMarkdownBySlug = {};

        // --- Function to Parse Markdown with Front Matter ---
        function parseMarkdownWithFrontMatter(markdownString) {
            const match = markdownString.match(/^---\s*([\s\S]*?)\s*---(\s*[\s\S]*)/);
            if (match && match[1] && match[2]) {
                const frontMatter = jsyaml.load(match[1]);
                const content = match[2].trim();
                return { frontMatter, content };
            }
            console.warn("Could not parse front matter for a post.");
            return { frontMatter: {}, content: markdownString };
        }

        // --- Function to Render Posts ---
        function renderPosts() {
            const container = document.getElementById('post-list-container');
            if (!container) { console.error("Post container not found!"); return; }
            if (typeof jsyaml === 'undefined') { console.error("js-yaml library not loaded!"); container.innerHTML = '<p class="text-red-500 text-center">Error: YAML parser not loaded.</p>'; return; }
            if (typeof marked === 'undefined') { console.error("Marked.js library not loaded!"); container.innerHTML = '<p class="text-red-500 text-center">Error: Markdown parser not loaded.</p>'; return; }

            container.innerHTML = ''; // Clear existing content

            blogPostMarkdownStrings.forEach((mdString, index) => {
                try {
                    const { frontMatter: postData, content: markdownContent } = parseMarkdownWithFrontMatter(mdString);

                    if (!postData.title || !postData.slug) {
                        console.warn(`Skipping post at index ${index} due to missing title or slug.`);
                        return;
                    }
                    fullMarkdownBySlug[postData.slug] = markdownContent;

                    const postHtml = `
                        <article class="bg-white p-6 rounded-lg shadow hover:shadow-lg transition-shadow duration-200">
                            <div class="post-card-inner-flex flex items-start space-x-6">
                                <div class="post-image-wrapper flex-shrink-0">
                                    <img src="${postData.imageUrl || 'https://placehold.co/150x100/cccccc/ffffff?text=No+Image'}"
                                         alt="${postData.imageAlt || 'Blog post image'}"
                                         class="post-image w-36 h-24 object-cover rounded-md shadow-sm">
                                </div>
                                <div class="flex-grow">
                                    <h3 class="text-xl font-semibold text-gray-800 mb-1">
                                        ${postData.title}
                                    </h3>
                                    <div class="text-sm text-gray-500 mb-2">
                                        <span>By ${postData.author || 'Unknown Author'}</span> | <span>${postData.date || 'No Date'}</span>
                                    </div>
                                    <p class="post-snippet text-gray-700 leading-relaxed mb-3">
                                        ${postData.snippet || 'No snippet available.'}
                                    </p>
                                    <div class="full-post-content prose prose-indigo max-w-none mt-4 hidden"></div>
                                    <button data-slug="${postData.slug}" class="read-more-btn text-indigo-600 hover:text-indigo-800 font-medium text-sm mt-2">
                                        Read more &rarr;
                                    </button>
                                </div>
                            </div>
                        </article>
                    `;
                    container.insertAdjacentHTML('beforeend', postHtml);
                } catch (e) {
                    console.error("Error processing Markdown/YAML for a post: ", e);
                    // Error display in UI can be added here if desired
                }
            });
        }

        // --- Function to Toggle Full Post Display ---
        function toggleFullPost(buttonElement) {
            const slug = buttonElement.dataset.slug;
            const articleElement = buttonElement.closest('article');
            if (!articleElement) return;

            const snippetElement = articleElement.querySelector('.post-snippet');
            const fullContentElement = articleElement.querySelector('.full-post-content');

            if (!snippetElement || !fullContentElement) return;

            const isExpanding = fullContentElement.classList.contains('hidden');
            articleElement.classList.toggle('expanded-view', isExpanding);


            if (isExpanding) {
                if (fullContentElement.innerHTML.trim() === '') {
                    const markdown = fullMarkdownBySlug[slug];
                    if (markdown) {
                        fullContentElement.innerHTML = marked.parse(markdown);
                    } else {
                        fullContentElement.innerHTML = "<p>Full content not found.</p>";
                    }
                }
                fullContentElement.classList.remove('hidden');
                snippetElement.classList.add('hidden');
                buttonElement.innerHTML = '&larr; Read less';
            } else {
                fullContentElement.classList.add('hidden');
                snippetElement.classList.remove('hidden');
                buttonElement.innerHTML = 'Read more &rarr;';
            }
        }

        // --- Event Listener for "Read more" buttons ---
        document.addEventListener('DOMContentLoaded', () => {
            renderPosts();
            const postListContainer = document.getElementById('post-list-container');
            if (postListContainer) {
                postListContainer.addEventListener('click', function(event) {
                    if (event.target.classList.contains('read-more-btn')) {
                        toggleFullPost(event.target);
                    }
                });
            }
        });
    </script>
